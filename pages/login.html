        <div class="signin">
            <div class="content">
                <h2 id="siginTitle">Sign In</h2>
                <form id="loginForm" class="form">
                    <div class="inputBox">
                        <input type="text" name="username" required class="form-control-input"> <i>Username</i>
                    </div>
                    <div class="inputBox">
                        <input type="password" name="password" required class="form-control-input"> <i>Password</i>
                    </div>
                    <!-- <div class="links"> <a href="#">Forgot Password</a> <a href="#">Signup</a>
                    </div> -->
                    <div id="errorMessage" style="color: red; margin-bottom: 10px;"></div>
                    <div class="inputBox">
                        <input type="submit" value="Login" id="loginButton" class="form-control-input">
                    </div>
                    <div class="inputBox">
                        <button id="showRegisterForm" class="form-control-input">Register</button>
                    </div>
                </form>

                <form id="registerForm" class="form" style="display: none;">
                    <div class="avatar-wrapper inputBox hl-vertical-center" id="imageUpload">
                        <p class="hl-text-white hl-margin-bottom-md">Avatar</p>
                        <input type="file" name="avatar" hidden accept="image/*" id="avatar">
                        <input type="hidden" name="avatar_path" id="avatarPath">
                        <label class="avatar-image-wrapper" for="avatar">
                            <img class="avatar-image img-x128" id="previewAvatarImage" src="../assets/icons/upload.svg"
                            alt="avatar image">
                        </label>
                    </div>
                    <div class="inputBox">
                        <input type="text" name="username" required class="form-control-input"> <i>Username</i>
                    </div>
                    <div class="inputBox">
                        <input type="email" name="email" required class="form-control-input"> <i>Email</i>
                    </div>
                    <div class="inputBox">
                        <input type="password" id="registerPassword" name="password" required class="form-control-input"> <i>Password</i>
                    </div>
                    <div class="inputBox">
                        <input type="password" id="retypePassword" name="retype_password" required class="form-control-input"> <i>Retype Password</i>
                    </div>
                    <div id="registerErrorMessage" style="color: red; margin-bottom: 10px;"></div>
                    <div class="inputBox">
                        <input type="submit" value="Register" id="registerButton" class="form-control-input">
                    </div>
                    <div class="inputBox">
                        <button id="showLoginForm" class="form-control-input">Back to Login</button>
                    </div>
