        <div class="signin">
            <div class="content">
                <h2>Sign In</h2>
                <form id="loginForm" class="form">
                    <div class="inputBox">
                        <input type="text" name="username" required> <i>Username</i>
                    </div>
                    <div class="inputBox">
                        <input type="password" name="password" required> <i>Password</i>
                    </div>
                    <!-- <div class="links"> <a href="#">Forgot Password</a> <a href="#">Signup</a>
                    </div> -->
                    <div id="errorMessage" style="color: red; margin-bottom: 10px;"></div>
                    <div class="inputBox">
                        <input type="submit" value="Login">
                    </div>
                </form>
            </div>
        </div>
    </section> 
    <script type="module">
        import { showToast } from '/js/common.js';
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        let redirectUrl = new URLSearchParams(window.location.search).get('redirect');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            const username = formData.get('username');
            const password = formData.get('password');

            try {
                const response = await fetch('/api/auth.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const result = await response.json();

                if (response.ok) {
                    showToast('Login', 'success', "Login successful!");
                    setTimeout(() => {
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {    
                            window.location.href = '/'; // Redirect to home page
                        }
                    }, 2000);
                } else {
                    errorMessage.textContent = result.error || 'Login failed!';
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred. Please try again.';
                console.error('Error:', error);
            }
        });
    </script>
