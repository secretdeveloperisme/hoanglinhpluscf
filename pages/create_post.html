<!DOCTYPE html>
<html lang="en">

<head>
  <title>Create Post</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/posts.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/atom-one-dark.css">
  <link rel="stylesheet" href="../assets/css/quill.snow.css">
  <link href="https://cdn.jsdelivr.net/npm/quill-table-better@1/dist/quill-table-better.css" rel="stylesheet" />

  <script type="module" src="../js/common.js"></script>
  <script src="../assets/libs/highlight_11-11-1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-table-better@1/dist/quill-table-better.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.css" integrity="sha384-DLNWBifkkOES5azVMtIZ7RYukF2HBwDMBcPyDl6VnXTdJKlv5aO1s6mnOLE0QUyP" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.js" integrity="sha384-SReR3XDzHJ+xHgprjPZ5oBp+3gHv4arv/iWnz2PGnkUH8lAYzPIIxY0C+I6F2G/o" crossorigin="anonymous"></script>
  <script type="module" src="../js/editor_configurations.js"></script>
  <script type="module" src="../js/post.js"></script>
</head>

<body>
  <div class="app">
    <form method="post" id="createPostForm">
      <div class="sidebar overflow-auto p-2">
        <div class="form-section" id="imageUpload">
          <div class="form-label">Image</div>
          <input type="file" name="postImage" hidden accept="image/*" id="postImage">
          <input type="hidden" name="cover_image" id="postImagePath">
          <label class="post-image-wrapper" for="postImage">
            <img class="border-danger img-thumbnail post-image" id="displayPostImage" src="../assets/icons/upload.svg"
              alt="post image">
          </label>
        </div>
        <div class="form-section">
          <div class="form-label">Tags</div>
          <div type="text" name="tags" contenteditable="true" id="tags" class="form-control tags"
            placeholder="separate tags by space">
          </div>
        </div>
        <div class="form-section">
          <div class="form-label">Status</div>
          <div class="post__status-container">
            <div class="mb-2">
              <input type="radio" hidden class="btn-check" name="post_status" id="publishedStatusRadio" value="PUBLISHED">
              <label for="publishedStatusRadio" class="btn btn-outline-success">PUBLISHED</label>
            </div>
            <div class="ms-2">
              <input type="radio" hidden class="btn-check" name="post_status" value="DRAFT" id="draftStatusRadio" checked>
              <label for="draftStatusRadio" class="btn btn-outline-danger">DRAFT</label>
            </div>
          </div>
        </div>
        <div class="form-section">
          <div class="form-label">Attachments</div>
          <div id="attachmentContainer" class="attachment-container"></div>
        </div>
      </div>
      <div class="content-section">
        <div class="p-2">
          <div class="form-section">
            <label for="title">
              <div class="form-label">Title: </div>
            </label>
            <input type="text" name="title" id="postTitle" class="form-control" required placeholder="Input your title ...">
          </div>
          <div class="form-section">
            <label for="description">
              <div class="form-label">Description: </div>
            </label>
            <input type="text" name="description" id="postDescription" class="form-control"
              placeholder="Input your description ...">
          </div>
          <div class="form-section" id="contentSection">
            <div class="form-label">Content</div>
            <div class="post-content bg-white">
              <div id="toolbar" class="ql-toolbar ql-snow sticky">
                <span class="ql-formats">
                  <select class="ql-font">
                    <option selected></option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Monospace</option>
                    <option value="roboto">Roboto</option>
                    <option value="inter">Inter</option>
                    <option value="lora">Lora</option>
                    <option value="jetbrain-mono">JetBrain Mono</option>
                    <option value="playfair">Playfair</option>
                  </select>
                  <select class="ql-size"></select>
                </span>
                <span class="ql-formats">
                  <button class="ql-bold"></button>
                  <button class="ql-italic"></button>
                  <button class="ql-underline"></button>
                  <button class="ql-strike"></button>
                </span>
                <span class="ql-formats">
                  <select class="ql-color"></select>
                  <select class="ql-background"></select>
                </span>
                <span class="ql-formats">
                  <button class="ql-script" value="sub"></button>
                  <button class="ql-script" value="super"></button>
                </span>
                <span class="ql-formats">
                  <button class="ql-header" value="1"></button>
                  <button class="ql-header" value="2"></button>
                  <button class="ql-header" value="3"></button>
                  <button class="ql-header" value="4"></button>
                  <button class="ql-blockquote"></button>
                  <button class="ql-code-block"></button>
                </span>
                <span class="ql-formats">
                  <button class="ql-list" value="ordered"></button>
                  <button class="ql-list" value="bullet"></button>
                  <button class="ql-indent" value="-1"></button>
                  <button class="ql-indent" value="+1"></button>
                </span>
                <span class="ql-formats">
                  <button class="ql-direction" value="rtl"></button>
                  <select class="ql-align"></select>
                </span>
                <span class="ql-formats">
                  <button class="ql-link"></button>
                  <button class="ql-image"></button>
                  <button class="ql-video"></button>
                  <button class="ql-formula"></button>
                </span>
                <span class="ql-formats">
                    <button class="ql-table-better"></button>
                </span>
                <span class="ql-formats">
                  <button class="ql-clean"></button>
                </span>
              </div>
              <div id="editor" class="pb-3"></div>
              <input type="hidden" name="content" id="postContent">
              <input type="hidden" name="reading_time" value="0" id="postReadingTime">
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="top-link">
    <div class="btn-group-wrapper p-2 bg-white w-100">
      <button class="button btn-primary" id="btnResetPost"><i class="fas fa-soap"></i>Reset</button>
      <button class="button btn-primary" id="btnCreatePost"><i class="fas fa-plus"></i>Create</button>
      <button class="button primary-button" onclick="window.scrollTo({top:0})">
        <i class="fa fa-arrow-up" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <script type="module" src="https://cdn.jsdelivr.net/npm/datalist-css/dist/datalist-css.min.js"></script>
  <div class="empty"></div>
</body>

</html>
